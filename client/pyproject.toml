[project]
name = "client"
version = "0.1.0"
description = "The best client ever"
readme = "README.md"
authors = [
    { name = "kaaquist", email = "kasperaaquist@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncclick>=8.3.0.7",
    "langchain-mcp-adapters>=0.2.1",
    "langchain-ollama>=1.0.1",
    "langgraph>=1.0.9",
    "langgraph-supervisor>=0.0.31",
    "mcp>=1.26.0",
    "chainlit>=2.9.6",
    "langchain>=1.2.10",
    "deepagents>=0.4.4",
]

[project.scripts]
client = "client.client:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
